<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 994" width="920" height="994" role="img" aria-labelledby="ttl dsc">
<title id="ttl">How the parts of the course build on one another</title>
<desc id="dsc">Seven parts in sequence, each leading to the next: Introduction (What is Data Science?, Stochastics, Python); Discrete stochastics and Numpy (Random variables, distributions, expected value, Numpy, Discrete distributions, first exploration); Continuous stochastics and Scipy (Continuous distributions, normal distribution, Scipy); Exploratory data analysis (Descriptive statistics, examples, Iris, Pandas, data cleaning); Multivariate stochastics (Covariance, multivariate normal distribution, relative entropy); Data protection (Data protection glossary); Machine learning (Clustering, dimensionality reduction, Statistical models, regression, kernels, Tests, model selection, expectation maximization).</desc>
<style>
  :root { color-scheme: light dark; }
  .band  { fill: #f2fbfb; stroke: #bfe4e4; }
  .node  { fill: #ffffff; stroke: #007d7e; stroke-width: 1.5; }
  .ptitle{ fill: #006364; font-weight: 600; }
  .ntext { fill: #1a1a1a; }
  .arrow { stroke: #007d7e; stroke-width: 2; fill: none; }
  .head  { fill: #007d7e; }
  text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .band  { fill: #16211f; stroke: #2a3d3c; }
    .node  { fill: #1b2225; stroke: #2cc5c5; }
    .ptitle{ fill: #6fdcdc; }
    .ntext { fill: #e9ecef; }
    .arrow { stroke: #2cc5c5; }
    .head  { fill: #2cc5c5; }
  }
</style>

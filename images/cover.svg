<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2100" viewBox="0 0 1400 2100"
     role="img" aria-label="Book cover: Data Science — from stochastics to machine learning with Python. a free open textbook by Konrad Völkel · 2026.">
  <title>Data Science — from stochastics to machine learning with Python</title>
  <desc>Cover of the open textbook "Data Science" by Konrad Völkel, 2026. An open book is drawn below the title, a wireframe globe and the Python logo on its right-hand page. A band across the top-right corner reads "now in English!". Licensed CC BY-SA 4.0.</desc>

  <defs>
    <clipPath id="cover-edge"><rect width="1400" height="2100"/></clipPath>
  </defs>

  <rect width="1400" height="2100" fill="#b5cbd6"/>

  <!-- The corner flash. A rotated band clipped to the board, not a filled triangle:
       a triangle has no inner edge, and the inner edge is what makes it read as a
       sticker on a cover rather than a corner that has been coloured in. -->
  <g clip-path="url(#cover-edge)">
    <g transform="translate(1400 0) rotate(45)">
      <rect x="-450.0" y="150" width="900"
            height="186" fill="#831990"/>
      <text x="0" y="262"
            text-anchor="middle"
            font-family="Inter Display, Inter, sans-serif" font-weight="700"
            font-size="54" fill="#2edc17"
            font-style="italic">now in English!</text>
    </g>
  </g>

  <!-- Title. Inter Display is the optical size cut for large type: tighter spacing and
       smaller apertures than Inter, which is drawn for body text and looks loose here.
       The negative tracking is Inter Display's own recommendation above ~48 px. -->
  <text x="118" y="610" font-family="Inter Display, Inter, sans-serif"
        font-weight="800" font-size="186" letter-spacing="-5" fill="#101418">Data Science</text>

  <text x="118" y="800" font-family="Inter Display, Inter, sans-serif"
        font-weight="300" font-size="104" letter-spacing="-1.5" fill="#003964">

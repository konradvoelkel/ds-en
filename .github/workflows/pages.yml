name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued run waits rather than racing an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# Where the site is published, in one place. BASE_URL sets only the *path*; MyST 1.10 has
# no setting at all for the origin (there is no SITE_URL), so the origin lives here and is
# patched into the built files below.
#
# MOVING THE SITE IS THESE TWO LINES -- the canonical URLs, the sitemap, the structured
# data and every preview card are derived from them at build time.
#
# Moved 2026-10-15 from https://konradvoelkel.github.io/ds-en to this custom domain. The
# site is still built and served by GitHub Pages; only the name in front of it changed, so
# the empty BASE_URL is what makes MyST build for a domain root instead of a subpath.
# GitHub redirects the old konradvoelkel.github.io/ds-en URLs here on its own, which is a
# real 301 and better than any stub we could publish.
env:
  SITE_ORIGIN: https://datascience.konradvoelkel.com
  BASE_URL: ""
  # The German edition, for the hreflang pair. It stays at the HHU for now (Konrad,
  # 2026-10-15). If it ever moves, this line and ds-skript's own half move together --
  # an hreflang pointing at a dead URL is worse than none.
  DE_SITE: https://voelkel.pages.cs.uni-duesseldorf.de/ds-skript

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, and this job genuinely needs it: tools/freshness.py dates
          # each page from `git log` of its source file, so that a chapter's date is when
          # the chapter changed and not when the build ran. actions/checkout clones with
          # fetch-depth 1 unless told otherwise -- one commit -- and `git log` would then
          # come back empty for nearly every file, at which point freshness.py aborts by
          # design rather than invent a date.
          #
          # Do not trim this back to save clone time. The failure it causes is not subtle
          # (the deploy goes red with that explanation), but the fix is five seconds of
          # clone and the alternative is a build-time date, which is a confident wrong
          # claim of exactly the kind the localhost sitemap was.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install mystmd, at the version this repository pins
        # Was a bare `npm install -g mystmd`, which is how the published site came to be
        # built by 1.11.0 on the day npm released it, while uv.lock still said 1.10.1 --
        # nobody decided that, and nothing recorded it. The version now comes from
        # requirements.txt, so there is one number, and a drift between the two is a red
        # build instead of a silent change of renderer.
        run: |
          v=$(grep '^mystmd==' requirements.txt | cut -d= -f3)
          [ -n "$v" ] || { echo "::error::no mystmd pin found in requirements.txt"; exit 1; }
          npm install -g "mystmd@$v"
          got=$(myst --version | tr -d 'v[:space:]')
          [ "$got" = "$v" ] || { echo "::error::myst reports $got, requirements.txt pins $v"; exit 1; }
          echo "mystmd $v"

      - name: TeX, for the PDF edition
        # The texlive list is the one the repository's own Dockerfile already uses, which
        # is where it was proven: latexmk drives xelatex and bibtex, the texlive-* sets
        # cover what the book's LaTeX template needs, imagemagick lets MyST convert
        # GIF/WebP figures for the LaTeX export.
        #
        # librsvg2-bin is *not* in that Dockerfile, and its absence here cost a run:
        # xelatex cannot include an SVG, so four chapters failed with "Cannot determine
        # size of graphic", latexmk carried on in force mode, and MyST reported success
        # over an 84 kB stub of a 19 MB book. ImageMagick cannot rasterise SVG on its own
        # -- it delegates, and on this runner there was nothing to delegate to. The local
        # build only worked because Inkscape happened to be installed.
        #
        # Why the Dockerfile could be right and this still wrong: the original's figures
        # here are PNGs with German labels (stochastik-statistik-wtheorie.png,
        # dsprozess-simplified-1..3.png). This edition redrew them as SVG to relabel them
        # in English, so it is the only one of the two that needs an SVG converter. The
        # upstream image is not missing anything.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            imagemagick librsvg2-bin latexmk texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra \
            texlive-lang-german

      - name: Date the edition, in the source
        # Writes `date:` into landing-page.md's frontmatter from the newest `git log` date
        # in the book -- before MyST runs, which is the whole point. Everything else in
        # freshness.py writes into the built HTML; a date a *reader* can see cannot be done
        # that way, because the theme re-renders the page header from the hydration payload
        # and markup written after the build is gone. Through the frontmatter it travels in
        # the payload and survives. Ported from ds-skript dedfd0b.
        #
        # Before the PDF step, so the printed title page carries the same date as the web
        # one; here a single call covers both, since the PDF is built first in this job.
        #
        # Only the landing page: a project-level `date` in myst.yml would print the same
        # day on all 30 pages and most would then claim a date their source does not
        # support. Needs the full history, like everything else in that file.
        #
        # PyYAML because the toc has to be read before the build exists -- config.json,
        # which freshness.py uses everywhere else, is an output of the build.
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 tools/freshness.py --stamp-source

      - name: Build the PDF edition
        # Before the HTML build, not after: MyST attaches the finished export to the site
        # and renders the download button from it. Built after, the PDF would be published
        # but nothing would link to it.
        #
        # Allowed to fail, deliberately. latexmk runs in force mode and a book this size
        # has many ways to upset it; a broken PDF must not take the website down with it.
        # When it fails there is simply no download button -- see the guard below, which
        # says so in the log rather than letting it pass unnoticed.
        continue-on-error: true
        run: myst build --pdf

      - name: A PDF that is too small is not a PDF
        # latexmk runs in force mode: it reports errors and produces a file anyway, and
        # MyST passes that on as success. So a failed PDF does not arrive as a failure, it
        # arrives as a stub -- 84 kB instead of 19 MB, every figure missing. Deleted here,
        # before the HTML build, so MyST does not attach a download button to it. The
        # floor is deliberately far below the real size: this is a smoke test for a
        # collapsed build, not a size assertion.
        run: |
          pdf=exports/ds-en.pdf
          if [ ! -f "$pdf" ]; then
            echo "::warning::no PDF was produced; the site will have no download button"
            exit 0
          fi
          bytes=$(stat -c%s "$pdf")
          if [ "$bytes" -lt 5000000 ]; then
            echo "::warning::the PDF is only $((bytes / 1024)) kB -- a 318-page book with"
            echo "::warning::figures is ~19 MB, so this build collapsed. Check the latexmk"
            echo "::warning::log for 'Cannot determine size of graphic'. Not publishing it."
            rm -f "$pdf"
          else
            echo "PDF looks complete: $((bytes / 1024 / 1024)) MB"
          fi

      - name: Build the book
        # Without BASE_URL every asset path points at the domain root -- or, when the site
        # is served from a subpath, at the wrong place entirely. The published site then
        # loads nothing at all while still answering 200, so it fails quietly.
        run: myst build --html

      - name: Re-encode the figures
        # Measured on the live site 2026-10-16: 21.3 MB of images over 30 pages, and a
        # 2712 ms LCP on descriptive-statistics against a 2500 ms budget. Matplotlib
        # writes RGBA, a plot has no transparency and few colours, and PNG compresses one
        # channel far better than four -- so this is ~45% off the figure payload with the
        # filenames and the pixels unchanged. See tools/optimize_images.py for the quality
        # gate and for what it refuses to touch.
        #
        # The committed images/ are optimised in the repository and checked by checks.yml;
        # this pass is for the notebook output, which is generated at build time and so
        # has nowhere else to be fixed.
        #
        # Versions come from requirements.txt for the same reason mystmd's does: so there
        # is one number per dependency in this repository and not two.
        run: |
          pil=$(grep '^pillow==' requirements.txt | cut -d= -f3)
          npy=$(grep '^numpy==' requirements.txt | cut -d= -f3)
          [ -n "$pil" ] && [ -n "$npy" ] || { echo "::error::no pillow/numpy pin in requirements.txt"; exit 1; }
          python3 -m pip install --quiet "pillow==$pil" "numpy==$npy"
          python3 tools/optimize_images.py _build/html/build

      - name: Write the absolute URLs MyST cannot write itself
        run: |
          SITE="$SITE_ORIGIN$BASE_URL"

          # MyST fetches robots.txt and sitemap.xml from its own dev server during the
          # static build and writes that server's origin into them. Without this step the
          # deployed sitemap lists 30 URLs on "http://localhost:3000" and robots.txt sends
          # crawlers to a machine that does not exist -- i.e. the site ships no sitemap.
          sed -i "s|http://localhost:3000|$SITE|g" _build/html/sitemap.xml _build/html/robots.txt

          # Point every <loc> at the URL that actually answers 200. GitHub Pages redirects
          # "/ds-en/kmeans" with a 301 to "/ds-en/kmeans/", but MyST writes the form
          # without the slash. A sitemap full of redirects -- and a canonical pointing at
          # one -- is needless ambiguity.
          sed -i "s|<loc>\($SITE[^<]*[^/]\)</loc>|<loc>\1/</loc>|g" _build/html/sitemap.xml
          sed -i "s|<loc>$SITE</loc>|<loc>$SITE/</loc>|" _build/html/sitemap.xml

          # og:image is root-relative ("/ds-en/build/<hash>.png"). OpenGraph requires an
          # absolute URL; Slack, LinkedIn, Mastodon and WhatsApp cannot resolve a relative
          # one and show no preview card at all.
          find _build/html -name '*.html' -exec \
            sed -i "s|content=\"$BASE_URL/build/|content=\"$SITE/build/|g" {} +

          # MyST emits neither a canonical nor a twitter:card. The canonical matters
          # because the same text is also published as a PDF and because this edition is
          # due to move host; the twitter:card tag is what makes X render the 1200x630
          # card large instead of cropping it to a small square.
          for f in $(find _build/html -name 'index.html'); do
            rel=$(dirname "${f#_build/html/}")
            # With the trailing slash: that is the URL that answers 200, see above.
            if [ "$rel" = "." ]; then url="$SITE/"; else url="$SITE/$rel/"; fi
            grep -q 'rel="canonical"' "$f" || sed -i \
              "s|</head>|<link rel=\"canonical\" href=\"$url\"/><meta name=\"twitter:card\" content=\"summary_large_image\"/></head>|" "$f"
          done

          # A date per page, from `git log` of the source file rather than from the build
          # clock: a build on Tuesday does not make a chapter from 2024 fresh. Sets
          # article:modified_time in every <head> and <lastmod> in every sitemap entry --
          # before this there were zero of 30 of each, measured on the live site. Needs
          # the full history, which is what fetch-depth: 0 on the checkout above is for;
          # with a shallow clone the script aborts rather than guess.
          #
          # Must run before inject_jsonld.py, which reads the date back out of the page
          # instead of computing it a second time. Ported from ds-skript e229a9d; the
          # date here is this edition's own commit, which is a decision and is argued in
          # the tool's docstring.
          python3 tools/freshness.py _build/html

          # Structured data for the work as a whole, on the landing page only. MyST emits
          # none, and it cannot live in landing-page.md: a {raw} html directive there
          # would be an extra block and break alignment with the German original.
          # python3 is preinstalled on ubuntu-latest.
          python3 tools/inject_jsonld.py "$SITE" _build/html/index.html

          # GitHub Pages reads the custom domain from this file. Derived from SITE_ORIGIN
          # so it cannot drift from the origin everything else was built with.
          echo "${SITE_ORIGIN#https://}" > _build/html/CNAME

          # GitHub Pages serves 404.html from the site root for any address that does not
          # exist. Without it a mistyped or stale link lands on GitHub's own branded page
          # with no way back into the book. Its links are absolute because it is served
          # under paths of arbitrary depth.
          sed "s|__SITE__|$SITE|g" _site/404.html > _build/html/404.html

          # Raw Markdown per chapter, the <link rel="alternate"> that points at it, and
          # llms.txt / llms-full.txt. MyST publishes HTML and a JSON payload; neither is
          # what a research tool wants to read.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 tools/llms_txt.py "$SITE" _build/html

          # Chapter-to-chapter hreflang, paired from sync/filemap.json. Must run after
          # the canonical above: the self-reference has to be the URL each page already
          # calls canonical, and the tool refuses if it is not.
          python3 tools/hreflang.py "$SITE" "$DE_SITE" _build/html

          # The two webfonts, served from this origin instead of from Google's. The
          # @import that used to be at the top of custom-style.css cost a three-deep
          # render-blocking chain, a third party on every page view, and -- in a book with
          # a GDPR chapter -- exactly the embedding that LG Muenchen I ruled on in 2022.
          # _site/fonts/PROVENANCE.txt has the files, their hashes and their licences.
          #
          # myst-theme.css is custom-style.css copied verbatim, so the placeholder is
          # substituted here, the same trick as __SITE__ in 404.html: a move of the book
          # stays the two env: lines at the top of this file.
          mkdir -p _build/html/fonts
          cp _site/fonts/*.woff2 _site/fonts/OFL-*.txt _build/html/fonts/
          # Every built stylesheet, not just myst-theme.css: MyST also drops a
          # fingerprinted copy of the user stylesheet in build/, and while the theme
          # loads /myst-theme.css, a copy serving a literal __BASE__ URL is not something
          # to leave lying in the artifact.
          find _build/html -name '*.css' -exec sed -i "s|__BASE__|$BASE_URL|g" {} +

          # The theme's own three stylesheets -- KaTeX, Font Awesome and the
          # jupyter-matplotlib widget CSS -- served from here instead of from jsdelivr and
          # cdnjs, along with the twenty KaTeX font files a page with mathematics pulls
          # after them. Same argument as the webfonts above, one step further out: these
          # are the theme's <link> tags rather than our stylesheet, so they are rewritten
          # after the build. _site/vendor/PROVENANCE.txt has the files, hashes and licences.
          #
          # The URLs live in the client bundles as well as in the HTML, so the rewrite
          # covers .js too -- without that, hydration re-adds the CDN links and the page
          # fetches both copies. See the tool's docstring.
          python3 tools/vendor_assets.py _build/html --base "$BASE_URL"

          # Trim the title suffix, add og:url and og:site_name, preload the fonts, and
          # lazy-load the figures below the fold -- which also means dropping the
          # <link rel=preload as=image> MyST writes for every figure, because a preloaded
          # image is fetched whatever loading="lazy" says. Runs after the canonical step:
          # og:url is given the same URL the canonical has.
          python3 tools/head_meta.py "$SITE" _build/html --base "$BASE_URL" --lang en

      - name: Refuse to publish a site that would load nothing, or that crawlers cannot use
        run: |
          SITE="$SITE_ORIGIN$BASE_URL"
          fail() { echo "::error::$1"; exit 1; }

          test -f _build/html/index.html || fail "no index.html was built"
          grep -q "$BASE_URL/build/" _build/html/index.html \
            || fail "index.html has no $BASE_URL asset paths; BASE_URL did not take"

          # Everything below guards the step above. Written as if/then/fi, not as
          # "check && fail": a bare "&& fail" as the last statement of the script makes the
          # step fail precisely when the check passes.
          if grep -rq "localhost:3000" _build/html/sitemap.xml _build/html/robots.txt; then
            fail "a localhost URL survived in sitemap.xml or robots.txt"
          fi

          pages=$(find _build/html -name index.html | wc -l)
          canon=$(find _build/html -name index.html -exec grep -l 'rel="canonical"' {} + | wc -l)
          locs=$(grep -c '<loc>' _build/html/sitemap.xml)
          [ "$pages" = "$canon" ] || fail "$pages pages but $canon canonicals"
          [ "$pages" = "$locs" ] || fail "$pages pages but $locs sitemap entries"

          # A <loc> without a trailing slash is one that redirects.
          if grep '<loc>' _build/html/sitemap.xml | grep -qv '/</loc>'; then
            fail "a sitemap entry still points at a redirecting URL"
          fi

          # Every preview image must be absolute, or the card stays empty.
          if find _build/html -name index.html -exec grep -ho 'og:image" content="[^"]*"' {} + \
               | grep -v "content=\"$SITE_ORIGIN" | grep -q .; then
            fail "an og:image is still relative"
          fi

          # The structured data must parse and must name this build's own origin --
          # stale structured data after a move is worse than none.
          python3 - "$SITE" <<'EOF'
          import json, re, sys
          html = open("_build/html/index.html", encoding="utf-8").read()
          blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          if len(blocks) != 1:
              sys.exit(f"::error::expected one JSON-LD block on the landing page, found {len(blocks)}")
          data = json.loads(blocks[0])
          want = sys.argv[1].rstrip("/") + "/"
          if data.get("url") != want:
              sys.exit(f"::error::JSON-LD url is {data.get('url')}, expected {want}")
          if not str(data.get("image", "")).startswith("http"):
              sys.exit("::error::JSON-LD image is not an absolute URL")
          if not str(data.get("dateModified", "")).startswith("20"):
              sys.exit(f"::error::JSON-LD dateModified is {data.get('dateModified')!r}; "
                       "freshness.py must run before inject_jsonld.py")
          print(f"JSON-LD ok: {data['@type']} at {data['url']}, as of {data['dateModified'][:10]}")
          EOF

          # A missing or stale CNAME silently drops the site back onto the github.io
          # address while every canonical keeps naming the custom domain -- the worst of
          # both, and invisible from the build log.
          want_host="${SITE_ORIGIN#https://}"
          [ -f _build/html/CNAME ] || fail "no CNAME in the artifact; the custom domain would be dropped"
          [ "$(cat _build/html/CNAME)" = "$want_host" ] \
            || fail "CNAME says $(cat _build/html/CNAME), SITE_ORIGIN says $want_host"

          grep -q "$SITE/" _build/html/404.html || fail "404.html has no link back into the book"
          test -s _build/html/llms.txt || fail "llms.txt is missing or empty"
          test -s _build/html/llms-full.txt || fail "llms-full.txt is missing or empty"
          # Every chapter must have a Markdown twin, or llms.txt points at 404s.
          mds=$(find _build/html -name index.md | wc -l)
          [ "$pages" = "$mds" ] || fail "$pages pages but $mds Markdown sources"

          # The PDF is allowed to fail; say so loudly rather than leaving it to be noticed
          # weeks later by a student who wanted the download.
          if ls _build/html/build/*.pdf >/dev/null 2>&1; then
            echo "PDF: $(du -h _build/html/build/*.pdf | head -1 | cut -f1)"
          else
            echo "::warning::no PDF in this build -- the site deploys without a download button"
          fi

          # No third-party font, ever again. This is the guard the 2026-10-16 change
          # exists for: the @import was one line in a stylesheet nobody re-reads, and
          # nothing else in the build would have reported it coming back -- it never
          # appears in the HTML, so none of the checks above could see it.
          #
          # Matched with the scheme, and only in the files a browser actually loads.
          # Without the scheme it also matches the sentence in custom-style.css that
          # explains why the @import was removed; and recursively it also matches the
          # fingerprinted copies of *previous* builds that MyST leaves in build/, which
          # nothing references and which a local incremental build will have lying
          # around. Either would be a guard that fails for a reason that is not the bug.
          for f in _build/html/myst-theme.css $(find _build/html -name index.html); do
            if grep -qs 'https://fonts\.googleapis\.com\|https://fonts\.gstatic\.com' "$f"; then
              fail "a Google Fonts reference is back in $f; see _site/fonts/PROVENANCE.txt"
            fi
          done
          if grep -rq '__BASE__' --include='*.css' _build/html; then
            fail "the __BASE__ placeholder survived in a stylesheet; the fonts would 404"
          fi
          for f in inter-latin.woff2 jetbrains-mono-latin.woff2; do
            test -s "_build/html/fonts/$f" || fail "_build/html/fonts/$f is missing or empty"
          done
          # The @font-face must point at a file that is actually there. Catches a rename
          # of either side, which would otherwise show up as the fallback font and
          # nothing else. Not written as `... | while read`: a pipeline runs its loop in
          # a subshell, so the exit 1 inside fail would leave the subshell and the step
          # would pass -- the same trap as the `&& fail` noted above.
          for u in $(grep -o "url('[^']*\.woff2')" _build/html/myst-theme.css | sed "s|url('||;s|')||"); do
            test -s "_build/html${u#$BASE_URL}" \
              || fail "myst-theme.css points at $u, which is not in the artifact"
          done

          # The theme's three stylesheets must not come from a CDN any more. Matched by
          # their specific URLs and not by the hostnames: thebe's runtime legitimately
          # fetches Pyodide, MathJax and require.js from those same two hosts when a
          # reader starts a live kernel, which is tens of megabytes and not vendorable.
          # Reading the book contacts no third party; running the code in it does, and a
          # guard written against the hostnames could only be satisfied by deleting thebe.
          for u in 'katex@[0-9.]*/dist/katex.min.css' \
                   'font-awesome/[0-9.]*/css/font-awesome.css' \
                   'jupyter-matplotlib@[0-9.]*/css/mpl_widget.css'; do
            if grep -rqsE "https://[^\"' ]*$u" --include='*.html' --include='*.js' --include='*.css' _build/html; then
              fail "a CDN reference to $u survived; see tools/vendor_assets.py"
            fi
          done
          for p in vendor/katex/katex.min.css vendor/font-awesome/css/font-awesome.css \
                   vendor/jupyter-matplotlib/mpl_widget.css; do
            test -s "_build/html/$p" || fail "_build/html/$p is missing or empty"
          done
          # The KaTeX stylesheet names its fonts relative to itself, so a missing fonts/
          # directory shows up only as mathematics set in a fallback font.
          katexfonts=$(ls _build/html/vendor/katex/fonts/*.woff2 2>/dev/null | wc -l)
          [ "$katexfonts" = "20" ] || fail "$katexfonts KaTeX woff2 files in the artifact, expected 20"
          test -s _build/html/vendor/font-awesome/fonts/fontawesome-webfont.woff2 \
            || fail "the Font Awesome face is missing; thebe's run/stop icons would be blank squares"
          # The OFL requires the licence to travel with the font it covers.
          for l in vendor/katex/LICENSE vendor/font-awesome/LICENSE vendor/jupyter-matplotlib/LICENSE; do
            test -s "_build/html/$l" || fail "_build/html/$l is missing"
          done

          # No formula may have failed to render. Adopted from ds-skript ddf3ddb after
          # Konrad found six on the live site that four structural audits had missed: a
          # failed formula is structurally perfect -- a span with text in it, no error
          # status, nothing absent -- and `myst build` prints nothing. The marker is
          # KaTeX's error in a title attribute.
          #
          # Counted on `title=` and not on the class, because the same class styles the
          # author's own {warning} admonitions, which carry no title.
          #
          # The `|| true` is ds-skript 081a7a9's bug, avoided rather than repeated:
          # `find -exec grep +` exits 1 when grep matches nothing, and here that is the
          # GOOD case. Under `set -eo pipefail` the assignment then aborts before any
          # message -- the guard going red precisely when it should pass. GitHub's default
          # shell is `bash -e` without pipefail, so this would survive today; it is written
          # not to depend on that, since one `shell: bash` anywhere would arm it.
          broken=$( { find _build/html -name index.html -exec grep -oh 'text-myst-warning-text" title="' {} + || true; } | wc -l )
          if [ "$broken" != "0" ]; then
            find _build/html -name index.html -exec grep -ho 'text-myst-warning-text" title="[^"]*"' {} + | sort -u | head -5
            fail "$broken formula(e) failed to render; see the KaTeX errors above"
          fi
          echo "no failed formulae on any page"

          # Every stylesheet's url() must point at something that exists, resolved the
          # way a browser resolves it. KaTeX writes `fonts/X.woff2` and Font Awesome
          # `../fonts/X.woff2`, so vendor layout and CSS are coupled; a rearrangement
          # would show up only as mathematics set in a fallback font.
          #
          # ds-skript 09cf4de lost its webfonts exactly this way and wrote
          # tools/check_css_assets.py for it. This edition was never exposed -- __BASE__ is
          # substituted rather than a relative path used -- but the vendored stylesheets
          # were unguarded all the same.
          #
          # Two refinements taken from that commit, the first after making its mistake
          # here too: **one resolvable source per @font-face is enough.** Only the woff2 is
          # vendored and the .woff/.ttf/.eot/.svg lines are deliberately left in the
          # upstream CSS (see _site/vendor/PROVENANCE.txt), so demanding all of them
          # flagged intent as breakage -- 45 "failures" on a build that was correct, i.e.
          # a guard nobody could satisfy and everybody would learn to ignore. The second:
          # a root-relative url() resolves against the *site* root, not one level above the
          # stylesheet, which is a different file entirely.
          python3 - "$BASE_URL" <<'EOF'
          import pathlib, re, sys
          base = (sys.argv[1] or "").strip("/")
          root = pathlib.Path("_build/html")

          def resolve(css: pathlib.Path, url: str) -> pathlib.Path | None:
              url = url.split("?")[0].split("#")[0]
              if not url or url.startswith(("http:", "https:", "data:", "//")):
                  return None
              if url.startswith("/"):
                  rel = url.lstrip("/")
                  if base and rel.startswith(base + "/"):
                      rel = rel[len(base) + 1:]
                  return root / rel
              return css.parent / url

          # Scoped to what this repository owns: the vendored stylesheets and our own
          # myst-theme.css. MyST's theme bundles under build/ carry an unrewritten
          # placeholder of its own -- /myst_assets_folder/_assets/plotly-*.svg, in four
          # files -- which is upstream's and which we would not fix. Flagging it would be
          # the unsatisfiable guard all over again. Noted for ds-skript, whose version
          # sweeps more broadly and will meet it.
          ours = sorted((root / "vendor").rglob("*.css")) + [root / "myst-theme.css"]
          bad = []
          for css in ours:
              if not css.is_file():
                  sys.exit(f"::error::{css} is missing")
              text = css.read_text(encoding="utf-8")
              faces = list(re.finditer(r"@font-face\s*\{(.*?)\}", text, re.S))
              for face in faces:
                  urls = re.findall(r"url\(\s*['\"]?([^'\")]+)", face.group(1))
                  targets = [t for t in (resolve(css, u) for u in urls) if t is not None]
                  if targets and not any(t.is_file() for t in targets):
                      bad.append(f"{css.relative_to(root)}: @font-face with no resolvable source ({urls[:2]})")
              # url()s outside any @font-face -- background images and the like -- have no
              # fallback list, so each one has to resolve on its own.
              outside = text
              for face in reversed(faces):
                  outside = outside[:face.start()] + outside[face.end():]
              for u in re.findall(r"url\(\s*['\"]?([^'\")]+)", outside):
                  t = resolve(css, u)
                  if t is not None and not t.is_file():
                      bad.append(f"{css.relative_to(root)} -> {u}")
          if bad:
              for b in bad[:8]:
                  print(f"::error::{b}")
              sys.exit(f"::error::{len(bad)} unresolvable CSS asset reference(s)")
          print(f"every @font-face in our {len(ours)} stylesheets has a source that exists")
          EOF

          # og:url and og:site_name on every page          # og:url and og:site_name on every page, and no chapter still carrying the
          # 48-character title suffix that SERPs truncated away on 29 of 30 pages.
          # The five card tags MyST does not write. og:type is "book" on the title page
          # and "article" on the chapters -- without it a platform assumes "website".
          # og:locale:alternate is the card's counterpart to the hreflang pair.
          for t in og:url og:site_name og:type og:locale og:locale:alternate; do
            n=$(find _build/html -name index.html -exec grep -l "property=\"$t\"" {} + | wc -l)
            [ "$pages" = "$n" ] || fail "$pages pages but $n $t tags"
          done
          # og:type must differ between the two kinds of page, which a count cannot see.
          grep -q 'property="og:type" content="book"' _build/html/index.html \
            || fail "the landing page is not og:type=book"
          if find _build/html -mindepth 2 -name index.html -exec grep -l 'og:type" content="book"' {} + | grep -q .; then
            fail "a chapter claims og:type=book"
          fi

          # The document title is the *first* <title> in the file; the pages also carry
          # SVG <title> elements, so a greedy match would read the wrong one.
          suffix=" - $(grep -o '<title>[^<]*</title>' _build/html/index.html | head -1 | sed 's|</*title>||g')"
          if find _build/html -mindepth 2 -name index.html -exec sh -c \
               'for f; do grep -o "<title>[^<]*</title>" "$f" | head -1; done' sh {} + \
               | grep -qF "$suffix</title>"; then
            fail "a chapter title still ends in \"$suffix\""
          fi

          # Three tags per page: the German counterpart, the self-reference and
          # x-default. A cluster missing its self-reference is discarded whole.
          hrefl=$(find _build/html -name index.html -exec grep -o 'hreflang=' {} + | wc -l)
          [ "$hrefl" = "$((pages * 3))" ] || fail "$hrefl hreflang tags, expected $((pages * 3))"
          # Every German URL claimed exactly once -- two English pages naming the same
          # counterpart is a mapping error, and silently poisons both clusters.
          de_total=$(find _build/html -name index.html -exec grep -ho 'hreflang="de" href="[^"]*"' {} + | wc -l)
          de_uniq=$(find _build/html -name index.html -exec grep -ho 'hreflang="de" href="[^"]*"' {} + | sort -u | wc -l)
          [ "$de_total" = "$de_uniq" ] || fail "a German counterpart is claimed by more than one page"

          # Two more invariants, adopted from ds-skript 6f193c7, which added them on its
          # side after working out that a one-sided cluster takes *both* editions down:
          # Google ignores unmatched hreflang, so 30/30 becomes 0/30 on both sides with
          # nothing red anywhere. tools/hreflang.py already refuses to emit either of
          # these wrong, so this is the artifact-level repeat of a generation-time rule --
          # worth having because two later steps (vendor_assets.py, head_meta.py) rewrite
          # the same <head> after hreflang has run.
          python3 - <<'EOF'
          import glob, os, re, sys
          pages = sorted(glob.glob("_build/html/*/index.html")) + ["_build/html/index.html"]
          bad = []
          for f in pages:
              html = open(f, encoding="utf-8").read()
              name = os.path.basename(os.path.dirname(f)) or "index"
              alt = dict(re.findall(
                  r'<link rel="alternate" hreflang="([^"]+)" href="([^"]+)"', html))
              canonical = re.search(r'<link rel="canonical" href="([^"]+)"', html)
              if set(alt) != {"de", "en", "x-default"}:
                  bad.append(f"{name}: hreflang tags {sorted(alt) or 'none'}, expected de/en/x-default")
              elif alt["x-default"] != alt["en"]:
                  bad.append(f"{name}: x-default {alt['x-default']} is not the hreflang=en URL {alt['en']}")
              elif not canonical:
                  bad.append(f"{name}: no canonical to check the self-reference against")
              elif canonical.group(1) != alt["en"]:
                  bad.append(f"{name}: canonical {canonical.group(1)} but self-reference {alt['en']}")
          if bad:
              for b in bad[:6]:
                  print(f"::error::{b}")
              sys.exit(f"::error::{len(bad)} page(s) with a broken hreflang cluster")
          print(f"hreflang clusters ok on {len(pages)} pages: de/en/x-default, "
                "x-default == en, self-reference == canonical")
          EOF

          # Counts the dates back off the built artifact: every page with an
          # article:modified_time and every sitemap entry with a <lastmod>. A date that
          # silently failed to land is the kind of thing only a measurement finds -- the
          # page looks identical either way.
          python3 tools/freshness.py _build/html --check

          echo "$pages pages, $canon canonicals, $locs sitemap entries, $mds Markdown, $hrefl hreflang, all absolute, CNAME $want_host"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: upstream check

# Triggered by the German original, not by a clock. ds-skript's own CI calls GitHub's
# dispatch API after a push to its default branch, and this runs then -- a moment when
# the HHU GitLab is demonstrably up, which is the whole point: pulling from it on a
# schedule failed, because GitHub's runners cannot reach that server (every attempt since
# 2026-10-14 timed out after ~134 s). Pushing out of HHU works; pulling into it does not.
#
# The weekly schedule is gone (Konrad, 2026-10-15). One consequence worth knowing: if the
# GitLab side ever stops calling -- an expired token, a changed CI file -- nothing here
# will say so, and the silence looks exactly like "the original has not changed".
#
#   >>> The dispatch token in ds-skript's CI expires on 2027-10-01. <<<
#
# On that day this workflow stops being triggered, silently. If you are reading this
# after it and wondering why no upstream issue has appeared in a while, that is the
# first thing to check: ds-skript -> Settings -> CI/CD -> Variables -> GH_DISPATCH_TOKEN.
# A manual run (workflow_dispatch, above) tells you whether the check itself still works.
on:
  repository_dispatch:
    types: [ds-skript-push]
  workflow_dispatch:
    inputs:
      commit:
        description: 'ds-skript commit to check against (default: its current HEAD)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone the German original
        # The dispatch proves the HHU runner could reach GitHub. It does not prove GitHub
        # can reach the HHU -- those are opposite directions, and it is the inbound one
        # that is blocked. Measured: of four dispatches on 2026-10-15, two cloned in 23 s
        # and two could not connect at all. So this is retried over a long window, not a
        # short one.
        #
        # The probe is what makes a long window affordable. git offers no connect timeout,
        # so a dead attempt costs ~134 s in the kernel; three of those filled the old
        # budget in eight minutes of mostly waiting. `curl --connect-timeout 10` answers
        # in ten seconds, so the budget buys actual elapsed time for the far end to come
        # back instead of buying TCP timeouts.
        #
        # 2026-10-16: an authentication failure is now told apart from an outage, because
        # for a day it was not. The run on 9236ee0 printed "reachable but the clone failed"
        # six times and then concluded the server "did not answer in ~16 minutes" -- a
        # self-contradiction, since the probe had just answered each time. git's actual
        # message was
        #     fatal: could not read Username for 'https://gitlab.cs.uni-duesseldorf.de'
        # in well under a second: ds-skript is private, and an anonymous clone cannot
        # work, now or later. Retrying that for sixteen minutes and then blaming the
        # network sends the next reader in precisely the wrong direction.
        #
        # GIT_TERMINAL_PROMPT=0 so git says so instead of trying to open a prompt it has
        # no terminal for.
        #
        # The clone target is a directory this step OWNS, never a sibling of the
        # checkout. It used to be `../ds-skript`, which on a runner is throwaway space
        # but locally is the real German repository: on 2026-10-16 a local trial of this
        # very step -- a stubbed `git` that always failed, so the failure path ran -- hit
        # the `rm -rf` below and deleted ds-skript off the author's machine. The stub
        # covered `git`. It did not cover `rm`. Four weeks of gitignored working notes
        # went with it.
        #
        # So: the path is constructed, never relative, and the guard below refuses to let
        # `rm -rf` point anywhere but at our own directory name. Keep it that way.
        run: |
          export GIT_TERMINAL_PROMPT=0
          UPSTREAM_DIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ds-skript-upstream"
          case "$UPSTREAM_DIR" in
            */ds-skript-upstream) ;;
            *) echo "::error::refusing to touch $UPSTREAM_DIR"; exit 1 ;;
          esac
          echo "UPSTREAM_DIR=$UPSTREAM_DIR" >> "${GITHUB_ENV:-/dev/null}"
          rm -rf "$UPSTREAM_DIR"
          for wait in 0 60 120 180 300 300; do
            [ "$wait" = 0 ] || { echo "unreachable; waiting ${wait}s"; sleep "$wait"; }
            curl -sS -o /dev/null --connect-timeout 10 --max-time 25 \
              https://gitlab.cs.uni-duesseldorf.de/ 2>/dev/null || continue
            err=$(git clone --filter=blob:none \
              https://gitlab.cs.uni-duesseldorf.de/voelkel/ds-skript.git "$UPSTREAM_DIR" 2>&1) \
              && exit 0
            rm -rf "$UPSTREAM_DIR"
            if printf '%s' "$err" | grep -qiE 'could not read Username|Authentication failed|terminal prompts disabled'; then
              echo "::error::ds-skript needs credentials, so no number of retries will help:"
              printf '::error::  %s\n' "$(printf '%s' "$err" | tail -1)"
              echo "::error::The staleness check cannot run on a GitHub runner against a"
              echo "::error::private GitLab repository without a token, and this repository"
              echo "::error::deliberately has no secrets (SEO-NOTES.md section 3). Until"
              echo "::error::that is decided, run it locally, where you have credentials:"
              echo "::error::  DS_SKRIPT=../ds-skript python3 tools/sync.py check <commit>"
              exit 1
            fi
            echo "reachable but the clone failed:"
            printf '  %s\n' "$(printf '%s' "$err" | tail -1)"
          done
          echo "::error::the HHU GitLab did not answer in ~16 minutes, although it just"
          echo "::error::dispatched to us. Nothing is stale-checked; re-run this workflow"
          echo "::error::by hand (Actions -> upstream check -> Run workflow) when it is up."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: What went stale?
        id: check
        env:
          # Whatever the caller said it pushed, for the issue title. Only used for
          # display; the comparison always runs against the clone's actual HEAD.
          CLAIMED: ${{ github.event.client_payload.sha || inputs.commit }}
        run: |
          set +e
          DS_SKRIPT="$UPSTREAM_DIR" python3 tools/sync.py check > /tmp/out.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          head -c 200000 /tmp/out.txt
          echo "sha=$(git -C "$UPSTREAM_DIR" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "claimed=$CLAIMED" >> "$GITHUB_OUTPUT"

      - name: Open an issue if anything needs re-translating
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          title="Upstream ds-skript moved to $SHA"
          if gh issue list --state open --search "$title in:title" --json title \
               | grep -q "$title"; then
            echo "issue already open"; exit 0
          fi
          report=$(ls -t sync/reports/*.md | head -1)
          # 60k keeps us well inside GitHub's issue body limit
          { echo "\`tools/sync.py check\` found English passages whose German original has changed."
            echo
            echo "Re-translate the blocks below, then bump \`sync/upstream.json\` and run \`tools/sync.py manifest\`."
            echo
            head -c 60000 "$report"
          } > /tmp/body.md
          # The label is a convenience; the report is the point. `gh issue create` fails
          # outright on a label the repository does not have -- which it did on the first
          # dispatch that ever got this far, after the staleness check had already done
          # its work. Create it if missing, and fall back to no label rather than lose
          # the report.
          gh label create upstream --color 007d7e \
            --description "The German original moved; passages here may need re-translating" \
            2>/dev/null || true
          gh issue create --title "$title" --body-file /tmp/body.md --label upstream \
            || gh issue create --title "$title" --body-file /tmp/body.md

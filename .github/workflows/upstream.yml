name: upstream check

# Triggered by the German original, not by a clock. ds-skript's own CI calls GitHub's
# dispatch API after a push to its default branch, and this runs then -- a moment when
# the HHU GitLab is demonstrably up, which is the whole point: pulling from it on a
# schedule failed, because GitHub's runners cannot reach that server (every attempt since
# 2026-10-14 timed out after ~134 s). Pushing out of HHU works; pulling into it does not.
#
# The weekly schedule is gone (Konrad, 2026-10-15). One consequence worth knowing: if the
# GitLab side ever stops calling -- an expired token, a changed CI file -- nothing here
# will say so, and the silence looks exactly like "the original has not changed".
#
#   >>> The dispatch token in ds-skript's CI expires on 2027-10-01. <<<
#
# On that day this workflow stops being triggered, silently. If you are reading this
# after it and wondering why no upstream issue has appeared in a while, that is the
# first thing to check: ds-skript -> Settings -> CI/CD -> Variables -> GH_DISPATCH_TOKEN.
# A manual run (workflow_dispatch, above) tells you whether the check itself still works.
on:
  repository_dispatch:
    types: [ds-skript-push]
  workflow_dispatch:
    inputs:
      commit:
        description: 'ds-skript commit to check against (default: its current HEAD)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone the German original, from its GitHub mirror
        # Not from the HHU GitLab. That instance refuses git over HTTP to anyone not
        # logged in -- the project page answers 200 to a stranger while
        # /ds-skript.git/info/refs answers 401 -- so a runner cannot clone it at all, and
        # no number of retries changes that. Every dispatch since this check existed
        # failed, first on reachability and then on credentials.
        #
        # konradvoelkel/ds-skript-mirror is a public copy on GitHub, kept current by a
        # job in ds-skript's own GitLab CI, which pushes after every commit. That puts the
        # one credential on the GitLab side, where Konrad already administers CI, and lets
        # this repository keep the property SEO-NOTES section 3 describes: no secrets.
        # GitLab stays the source of truth; nothing here ever writes to the mirror.
        run: |
          export GIT_TERMINAL_PROMPT=0
          UPSTREAM_DIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ds-skript-upstream"
          case "$UPSTREAM_DIR" in
            */ds-skript-upstream) ;;
            *) echo "::error::refusing to touch $UPSTREAM_DIR"; exit 1 ;;
          esac
          echo "UPSTREAM_DIR=$UPSTREAM_DIR" >> "${GITHUB_ENV:-/dev/null}"
          rm -rf "$UPSTREAM_DIR"
          for wait in 0 20 60; do
            [ "$wait" = 0 ] || { echo "retrying in ${wait}s"; sleep "$wait"; }
            git clone --filter=blob:none \
              https://github.com/konradvoelkel/ds-skript-mirror.git "$UPSTREAM_DIR" \
              && break
            rm -rf "$UPSTREAM_DIR"
          done
          if [ ! -d "$UPSTREAM_DIR/.git" ]; then
            echo "::error::could not clone the mirror. It is a public GitHub repository"
            echo "::error::reachable from this runner, so this is not the old HHU problem."
            echo "::error::Check that konradvoelkel/ds-skript-mirror still exists and is"
            echo "::error::public: https://github.com/konradvoelkel/ds-skript-mirror"
            exit 1
          fi

      - name: Is the mirror current enough to judge staleness?
        # A mirror that has stopped updating would quietly report "up to date" forever,
        # which is the failure this whole check exists to prevent -- so it is named rather
        # than trusted. Two days allows for a weekend of no pushes on either side.
        run: |
          # An empty repository clones *successfully* -- .git exists, there is just no
          # commit -- so the check below has to ask before it counts, or it reports a shell
          # arithmetic error instead of the one fact that matters.
          if ! git -C "$UPSTREAM_DIR" rev-parse HEAD >/dev/null 2>&1; then
            echo "::error::the mirror exists but is empty: nothing has pushed to it yet."
            echo "::error::It is filled by a job in ds-skript's GitLab CI, which has to be"
            echo "::error::added there (the prompt is in sync/handover-ds-skript.md). A"
            echo "::error::token alone does not push; something has to run git push --mirror."
            exit 1
          fi
          AGE_DAYS=$(( ( $(date +%s) - $(git -C "$UPSTREAM_DIR" log -1 --format=%ct) ) / 86400 ))
          echo "mirror HEAD is $AGE_DAYS day(s) old: $(git -C "$UPSTREAM_DIR" log -1 --format='%h %s')"
          if [ "$AGE_DAYS" -gt 2 ]; then
            echo "::error::the mirror's newest commit is $AGE_DAYS days old. Either ds-skript"
            echo "::error::has genuinely been quiet that long, or the mirror job in its"
            echo "::error::GitLab CI has stopped pushing. Until that is known, a result"
            echo "::error::from this check means nothing, so it does not produce one."
            echo "::error::Check the mirror job: ds-skript -> CI/CD -> Pipelines."
            exit 1
          fi

      - name: What went stale?
        id: check
        env:
          # Whatever the caller said it pushed, for the issue title. Only used for
          # display; the comparison always runs against the clone's actual HEAD.
          CLAIMED: ${{ github.event.client_payload.sha || inputs.commit }}
        run: |
          set +e
          DS_SKRIPT="$UPSTREAM_DIR" python3 tools/sync.py check > /tmp/out.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          head -c 200000 /tmp/out.txt
          echo "sha=$(git -C "$UPSTREAM_DIR" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "claimed=$CLAIMED" >> "$GITHUB_OUTPUT"

      - name: Open an issue if anything needs re-translating
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          title="Upstream ds-skript moved to $SHA"
          if gh issue list --state open --search "$title in:title" --json title \
               | grep -q "$title"; then
            echo "issue already open"; exit 0
          fi
          report=$(ls -t sync/reports/*.md | head -1)
          # 60k keeps us well inside GitHub's issue body limit
          { echo "\`tools/sync.py check\` found English passages whose German original has changed."
            echo
            echo "Re-translate the blocks below, then bump \`sync/upstream.json\` and run \`tools/sync.py manifest\`."
            echo
            head -c 60000 "$report"
          } > /tmp/body.md
          # The label is a convenience; the report is the point. `gh issue create` fails
          # outright on a label the repository does not have -- which it did on the first
          # dispatch that ever got this far, after the staleness check had already done
          # its work. Create it if missing, and fall back to no label rather than lose
          # the report.
          gh label create upstream --color 007d7e \
            --description "The German original moved; passages here may need re-translating" \
            2>/dev/null || true
          gh issue create --title "$title" --body-file /tmp/body.md --label upstream \
            || gh issue create --title "$title" --body-file /tmp/body.md

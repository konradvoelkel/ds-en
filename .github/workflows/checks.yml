name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, and the only workflow here that lacked it -- GitHub's code scanning
# flagged it (actions/missing-workflow-permissions). Without the block a job inherits
# whatever the repository's default is, which is a write token in many setups. This one
# reads the checkout and uploads an artifact; neither needs more than read.
permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # No clone of the German original any more. It used to be cloned for the alignment
      # check alone, and from GitHub's runners the HHU GitLab is not reachable: every
      # attempt since 2026-10-14 timed out after ~134 s, three times per run, and turned
      # every push red for a reason that had nothing to do with the push.
      #
      # The alignment check does not need it. sync/segments/ records the block structure
      # of the original per chapter, for a named upstream commit, and align refuses to run
      # if that commit no longer matches the pin. Checking the manifest against the real
      # German text is `sync.py check`, and that now runs in upstream.yml when ds-skript
      # tells us it has moved -- i.e. at a moment when its server is demonstrably up.
      - name: Block alignment with the German original
        run: python3 tools/sync.py align

      - name: The PDF export still matches the table of contents
        # myst.yml holds the structure twice. A chapter in the toc but missing from the
        # export list is invisible in the printed book and nothing else would say so.
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 tools/check_pdf_articles.py

      - name: German left behind in the English text
        run: python3 tools/check_english.py

      - name: Notebook sources survive an export/import round-trip
        run: for nb in *.ipynb; do python3 tools/nbtext.py check "$nb"; done

      - name: Every figure still has its description
        # --complete, not --check: all 156 are written, so the stricter gate can hold the
        # line. It fails on a description overwritten by a re-execution without a following
        # --apply, on one orphaned by a deleted cell, and on a new figure arriving without
        # one. Four animation cells are listed as exceptions in the tool, with the reason.
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 tools/alt_texts.py --complete

      - name: Committed artwork is still what it claims to be
        # Both are generated files kept in the repository, but they can be checked to
        # different depths, and only one of them honestly.
        #
        # The diagram is built as text, so re-generating it here gives the same bytes as
        # on any other machine: a hand-edit or an un-rerun generator is caught exactly.
        #
        # The card is *rendered*, through Pillow, zlib, freetype and system fonts, none of
        # which is pinned on a runner. Comparing its bytes here would be a check that
        # fails for reasons having nothing to do with the card. So CI asserts the property
        # that actually matters and needs no dependency -- that the card is present and
        # still 1200x630, an undersized card being the bug the file exists to prevent.
        # The byte-exact comparison stays available locally as --check.
        #
        # The logo is the third case and sits with the card: it is rendered from its SVG
        # by librsvg or Inkscape, against whatever cairo and system fonts a machine has,
        # so --verify asserts the properties no renderer can disagree about -- a 216x108
        # PNG whose alpha channel is in use, still matching the source's aspect ratio.
        # Undersized, opaque or reshaped are the three ways it can go wrong.
        run: |
          python3 tools/social_card.py --verify
          python3 tools/course_diagram.py --check
          python3 tools/logo_raster.py --verify

      - name: Committed figures are still optimised
        # The repository's own images, not the build's -- pages.yml re-encodes the
        # notebook output on the way out, but images/ is reviewed and committed, so a
        # new 5 MB screenshot has to be caught here rather than quietly re-encoded on
        # every deploy.
        #
        # --check changes nothing; it reports and fails with the command to run. The
        # floor in the tool is what keeps this from failing on a few bytes of palette
        # reordering, i.e. from being a guard that can never be made green.
        #
        # 1600 px is the cap for hand-made figures: the widest the page renders one is
        # 480 px, and 1600 across a text-width figure is still over 300 dpi in the PDF.
        run: |
          pil=$(grep '^pillow==' requirements.txt | cut -d= -f3)
          npy=$(grep '^numpy==' requirements.txt | cut -d= -f3)
          python3 -m pip install --quiet "pillow==$pil" "numpy==$npy"
          python3 tools/optimize_images.py images --max-width 1600 --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mystmd, at the version this repository pins
        # Was a bare `npm install -g mystmd`, which is how the published site came to be
        # built by 1.11.0 on the day npm released it, while uv.lock still said 1.10.1 --
        # nobody decided that, and nothing recorded it. The version now comes from
        # requirements.txt, so there is one number, and a drift between the two is a red
        # build instead of a silent change of renderer.
        run: |
          v=$(grep '^mystmd==' requirements.txt | cut -d= -f3)
          [ -n "$v" ] || { echo "::error::no mystmd pin found in requirements.txt"; exit 1; }
          npm install -g "mystmd@$v"
          got=$(myst --version | tr -d 'v[:space:]')
          [ "$got" = "$v" ] || { echo "::error::myst reports $got, requirements.txt pins $v"; exit 1; }
          echo "mystmd $v"

      - name: Build the book
        run: myst build --html

      - uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: _build/html
          retention-days: 14

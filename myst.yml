version: 1
project:
  id: ds-skript
  short_title: DS
  title: Data Science Vorlesungsskript
  subtitle: im Bachelor Informatik
  description: Skript zur Vorlesung an der HHU
  authors:
    - name: Dr. Konrad Völkel
      affiliations:
        - Heinrich-Heine Universität Düsseldorf
      url: http://www.konradvoelkel.com
  license: CC-BY-SA-4.0
  copyright: 2026 CC-BY-SA 4.0
  exclude:
    - README.md
    - slides/**
    - LICENSE
    - .git/*
    - .venv/*
  bibliography:
    - references.bib
  settings:
    myst_to_tex:
      code_style: listings
  exports:
    - format: pdf
      template: ./templates/tex/ds-skript
      output: exports/ds-skript.pdf
  toc:
    - file: landing-page.md
    - title: Einführung
      children:
        - file: what-is-data-science.md
        - file: intro-probability.md
        - file: intro-python.ipynb
    - title: Diskrete Stochastik und Numpy
      children:
        - file: programming-probability.ipynb
        - file: random-variables-distributions.md
        - file: expectation-variance.md
        - file: numpy.ipynb
        - file: important-discrete-distributions.ipynb
        - file: titanic-eda-numpy.ipynb
    - title: Stetige Stochastik und Scipy
      children:
        - file: continuous-distributions.md
        - file: normal-distribution.ipynb
        - file: important-continuous-distributions.ipynb
    - title: Explorative Datenanalyse
      children:
        - file: descriptive-statistics.md
        - file: eda-examples.ipynb
        - file: iris.ipynb
        - file: pandas.ipynb
        - file: data-cleaning.ipynb
    - title: Multivariate Stochastik
      children:
        - file: covariance.md
        - file: multivariate-normal.ipynb
        - file: relative-entropy.md
    - title: Datenschutz
      children:
        - file: data-protection.md
    - title: Maschinelles Lernen
      children:
        - file: kmeans.ipynb
        - file: statistical-models.md
        - file: dimensionality-reduction.ipynb
        - file: linear-regression.ipynb
        - file: kernel-methods.ipynb
        - file: statistical-tests.md
        - file: model-selection.ipynb
        - file: expectation-maximization.ipynb
    - file: slides.md
site:
  options:
    logo: images/logo-wide.svg
    favicon: images/favicon.ico
    folders: true
    style: _site/custom-style.css
  template: book-theme

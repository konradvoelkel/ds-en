version: 1
project:
  id: ds-en
  short_title: DS
  title: Data Science Lecture Notes from Konrad Völkel
  subtitle: BSc Computer Science
  description: English edition of the Data Science lecture notes, translated from the German original
  authors:
    - name: Dr. Konrad Völkel
      affiliations:
        - Heinrich Heine University Düsseldorf
      url: http://www.konradvoelkel.com
  license: CC-BY-SA-4.0
  copyright: 2026 CC-BY-SA 4.0
  exclude:
    - README.md
    - slides/**
    - LICENSE
    - .git/*
    - .venv/*
  bibliography:
    - references.bib
  settings:
    myst_to_tex:
      code_style: listings
  exports:
    - format: pdf
      template: ./templates/tex/ds-en
      output: exports/ds-en.pdf
  toc:
    - file: landing-page.md
    - title: Introduction
      children:
        - file: what-is-data-science.md
        - file: intro-stochastics.md
        - file: intro-python.ipynb
    - title: Discrete stochastics and Numpy
      children:
        - file: programming-stochastics.ipynb
        - file: random-variables-distributions.md
        - file: expectation-variance.md
        - file: numpy.ipynb
        - file: important-discrete-distributions.ipynb
        - file: titanic-eda-numpy.ipynb
    - title: Continuous stochastics and Scipy
      children:
        - file: continuous-distributions.md
        - file: normal-distribution.ipynb
        - file: important-continuous-distributions.ipynb
    - title: Exploratory data analysis
      children:
        - file: descriptive-statistics.md
        - file: eda-examples.ipynb
        - file: iris.ipynb
        - file: pandas.ipynb
        - file: data-cleaning.ipynb
    - title: Multivariate stochastics
      children:
        - file: covariance.md
        - file: multivariate-normal.ipynb
        - file: relative-entropy.md
    - title: Data protection
      children:
        - file: data-protection.md
    - title: Machine learning
      children:
        - file: kmeans.ipynb
        - file: statistical-models.md
        - file: dimensionality-reduction.ipynb
        - file: linear-regression.ipynb
        - file: kernel-methods.ipynb
        - file: statistical-tests.md
        - file: model-selection.ipynb
        - file: expectation-maximization.ipynb
site:
  options:
    logo: images/logo-wide.svg
    favicon: images/favicon.ico
    folders: true
    style: _site/custom-style.css
  template: book-theme
